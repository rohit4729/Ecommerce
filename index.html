<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Local Shop | Fresh Finds, Best Prices</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- EmailJS Script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --whatsapp: #25D366;
            --bg-color: #f8fafc;
            --text-dark: #0f172a;
            --text-light: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            width: 100%;
            height: 80vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://i.ibb.co/99mnFfP9/hero-Image.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 1rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #e2e8f0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* --- Products Section --- */
        .products-section {
            padding: 4rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        /* Carousel Styles */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            gap: 1.5rem;
            padding-bottom: 1rem;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }

        /* Hide Scrollbar but keep functionality */
        .carousel-container::-webkit-scrollbar {
            height: 8px;
        }
        .carousel-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .product-card {
            min-width: 280px;
            background: white;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .product-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .add-to-cart-btn {
            width: 100%;
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .add-to-cart-btn:hover {
            background: var(--primary);
        }

        /* --- Floating Icons --- */
        .floating-whatsapp {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background-color: var(--whatsapp);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            transition: transform 0.3s;
        }

        .floating-whatsapp:hover {
            transform: scale(1.1);
        }

        .floating-cart {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
            z-index: 1000;
            transition: transform 0.3s;
        }

        .floating-cart:hover {
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Cart Modal / Drawer --- */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 1001;
        }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: right 0.4s ease;
            z-index: 1002;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.active {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            padding: 1.5rem;
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        /* Order Form */
        .order-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
        }

        .send-order-btn {
            width: 100%;
            background: var(--whatsapp);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-order-btn:hover {
            background: #20b858;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .hero h1 { font-size: 2.2rem; }
            .product-card { min-width: 240px; }
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <h1>The Local Shop</h1>
        <p>Fresh Finds, Best Prices</p>
        <a href="#products" class="btn">Shop Now</a>
    </header>

    <!-- Products Section -->
    <section id="products" class="products-section">
        <h2 class="section-title">Our Products</h2>
        
        <!-- Product Carousel -->
        <div class="carousel-container" id="carousel">
            <!-- Products injected here via JavaScript -->
        </div>
    </section>

    <!-- Floating Buttons -->
    <a href="https://wa.me/8261018061" target="_blank" class="floating-whatsapp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <div class="floating-cart" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cart-count">0</span>
    </div>

    <!-- Cart Modal Overlay -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <!-- Cart Items injected via JS -->
            <p style="text-align:center; color:#64748b; margin-top: 2rem;">Your cart is empty.</p>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">₹0</span>
            </div>
            
            <form class="order-form" id="order-form" onsubmit="sendOrder(event)">
                <input type="text" id="customer-name" placeholder="Your Full Name" required>
                <input type="tel" id="customer-phone" placeholder="Your Phone Number" required>
                <input type="text" id="customer-address" placeholder="Your address" required>
                <button type="submit" class="send-order-btn" id="submit-btn">
                    <i class="fas fa-envelope"></i> Send Order via Email
                </button>
            </form>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        // ==========================================
        // 1. PRODUCT DATA (You can edit prices here)
        // ==========================================
        const products = [
            { id: 1, name: "Oppo Enco Air2i", price: 999, image: "https://i.ibb.co/XZbXqqSY/Airpod.jpg", desc: "1 year Manufacturer Warranty, Wireless, rhythmic bass, Dolby Atmos " },
            { id: 2, name: "OPPO Smartphone", price: 25000, image: "https://i.ibb.co/W4QTny9B/OPPO-Phone.jpg", desc: "Oppo F27 Pro+ 5G, Circular Cosmos Ring camera module, 8Gb Ram, 128Gb Storage"  },
            { id: 3, name: "Premium Pen (Elkos Colours)", price: 99, image: "https://i.ibb.co/LDp6JNsx/pen.jpg", desc: "Smooth writing, Plastic body, Blue Ink" },
            { id: 4, name: "Stylish Spectacles (Lenskart Blu)", price: 1700, image: "https://i.ibb.co/rKDF4rqC/Spectical.jpg", desc: "Blue-cut lenses, light-weight frame " },
            { id: 5, name: "Spectacles with Case (Wayfarer Eyeglasses)", price: 2000, image: "https://i.ibb.co/B5cRZ467/Spectical-With-Case.jpg", desc: "Anti-glare, Premium hard case included" }
        ];

        let cart = [];

        // ==========================================
        // 2. RENDER PRODUCTS TO CAROUSEL
        // ==========================================
        const carousel = document.getElementById('carousel');
        
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}">
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p class="product-price">₹${product.price}</p>
                    <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 1rem;">${product.desc}</p>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                </div>
            `;
            carousel.appendChild(card);
        });

        // ==========================================
        // 3. CART LOGIC
        // ==========================================
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            
            // Visual feedback
            const btn = event.target;
            btn.innerHTML = "Added! ✓";
            btn.style.background = "var(--whatsapp)";
            setTimeout(() => {
                btn.innerHTML = "Add to Cart";
                btn.style.background = "var(--text-dark)";
            }, 1000);
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotalPrice = document.getElementById('cart-total-price');

            // Update Badge
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.innerText = totalItems;

            // Update Items List
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; color:#64748b; margin-top: 2rem;">Your cart is empty.</p>';
                cartTotalPrice.innerText = '₹0';
                return;
            }

            let totalPrice = 0;
            cart.forEach(item => {
                totalPrice += item.price * item.quantity;
                cartItemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div class="cart-item-title">${item.name}</div>
                            <div style="color: var(--text-light); font-size: 0.8rem;">₹${item.price} x ${item.quantity}</div>
                        </div>
                        <div class="cart-item-controls">
                            <strong>₹${item.price * item.quantity}</strong>
                            <button onclick="removeFromCart(${item.id})" style="color:red; background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            cartTotalPrice.innerText = `₹${totalPrice}`;
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // Toggle Drawer
        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('active');
            document.getElementById('cart-overlay').classList.toggle('active');
        }

        // ==========================================
        // 4. EMAILJS INTEGRATION (SEND ORDER)
        // ==========================================
        
        // IMPORTANT: Initialize EmailJS with your PUBLIC KEY
        // You can get this by creating a free account at https://www.emailjs.com/
        emailjs.init("LrSeDbSgWqgNuZ0jT"); 

        function sendOrder(e) {
            e.preventDefault();
            
            if (cart.length === 0) {
                alert("Please add items to your cart first!");
                return;
            }

            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;
            const btn = document.getElementById('submit-btn');

            // Format cart into readable text for the email
            let orderText = `New Order from ${name} \nPhone: ${phone}\nAddress: ${address}\n\nItems Ordered:\n`;
            let total = 0;
            
            cart.forEach(item => {
                orderText += `- ${item.name} | Qty: ${item.quantity} | Price: ₹${item.price * item.quantity}\n`;
                total += (item.price * item.quantity);
            });
            orderText += `\nGRAND TOTAL: ₹${total}`;

            // Prepare parameters for EmailJS Template
            const templateParams = {
                to_email: 'rohitmandal214339@gmail.com', // Your email
                customer_name: name,
                customer_phone: phone,
                order_details: orderText
            };

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            // REPLACE "YOUR_SERVICE_ID" and "YOUR_TEMPLATE_ID" 
            // with the actual IDs from your EmailJS dashboard.
            emailjs.send("service_l2we1us", "template_9zevt5k", templateParams)
                .then(function(response) {
                    alert("Order sent successfully! We will contact you soon.");
                    cart = []; // Clear Cart
                    updateCartUI();
                    toggleCart();
                    document.getElementById('order-form').reset();
                    btn.innerHTML = '<i class="fas fa-envelope"></i> Send Order via Email';
                    btn.disabled = false;
                }, function(error) {
                    alert("Failed to send order. Please try again or contact via WhatsApp.");
                    console.log('FAILED...', error);
                    btn.innerHTML = '<i class="fas fa-envelope"></i> Send Order via Email';
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
